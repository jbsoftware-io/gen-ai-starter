name: Python package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required for pushing to gh-pages branch
      pages: write     # Required for GitHub Pages
      id-token: write  # Required for GitHub Pages deployment
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for gh-pages branch handling
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: KengoTODA/actions-setup-docker-compose@v1
        with:
          version: '2.14.2'
      - name: docker compose build
        run: docker-compose build
      - name: Run Lint
        run: |
          docker-compose run --rm app sh -c 'flake8 src'
      - name: Run Docker Compose Up waiting for healthchecks
        run: |
          docker-compose up -d --wait
      - name: Run Tests
        run: |
          docker-compose run --rm app sh -c 'pytest -v --cov=src --cov-report=html --cov-report=term-missing --cov-report=xml --junit-xml=test-results.xml'
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: test-results.xml
          check_name: "Test Results"
          comment_title: "Test Results"
      - name: Archive test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
      - name: Archive coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
      - name: Archive coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Coverage Report Summary
        run: ./.github/scripts/coverage_summary.sh
      - name: Update GitHub Pages Badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./.github/scripts/update_github_pages_badge.sh